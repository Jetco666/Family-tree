<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Tree — Keluarga Besar</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><div><div class="eyebrow">FAMILY TREE</div><h1 id="familyTitle">Keluarga Besar</h1></div><div class="top-actions"><button id="searchBtn" class="icon-btn">⌕</button><button id="themeBtn" class="icon-btn">◐</button><button id="resetBtn" class="btn">Reset Tampilan</button></div></header>
<main><section class="hero"><div><span class="badge">🌳 Silsilah Keluarga</span><h2>Jelajahi hubungan keluarga secara interaktif.</h2><p>Klik anggota untuk melihat pasangan, orang tua, saudara, dan anak. Gunakan zoom atau geser area pohon.</p></div><div class="stats"><div><strong id="memberCount">0</strong><span>Anggota</span></div><div><strong id="generationCount">0</strong><span>Generasi</span></div></div></section>
<section class="toolbar"><div class="search-wrap"><input id="searchInput" placeholder="Cari nama anggota keluarga..." autocomplete="off"><div id="searchResults" class="search-results hidden"></div></div><div class="controls"><button id="zoomOut" class="control">−</button><button id="zoomIn" class="control">+</button><button id="fitBtn" class="control wide">Fit</button><button id="fullBtn" class="control">⛶</button></div></section>
<section id="treeViewport" class="tree-viewport"><div id="treeCanvas" class="tree-canvas"></div><div class="hint">Geser untuk melihat cabang lain • Scroll untuk zoom</div></section></main>
<aside id="profilePanel" class="panel"><button id="closePanel" class="close">×</button><div id="profileContent"></div></aside><div id="overlay" class="overlay hidden"></div>
<script src="family-data.js"></script><script src="app.js"></script></body></html>
